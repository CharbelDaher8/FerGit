# Tests FerGit on Windows and macOS, then builds the installers for both.
#
# - Every pull request: checks and tests, then installers uploaded as workflow artifacts
#   (Actions tab → the run → Artifacts), which expire after 90 days.
# - Every push to main: the same, plus the "latest" prerelease is replaced with the new
#   installers, so its download links always serve the current main.
# - Pushing a tag like v0.1.0: the same, plus a published GitHub Release with the installers
#   attached. The tag must match the version in src-tauri/tauri.conf.json.
#
# The builds are not code-signed: Windows SmartScreen and macOS Gatekeeper will warn when the
# installers are opened.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Check, test and build the frontend
        run: |
          npm run check
          npm test
          npm run build

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test -p fergit-core -p fergit-graph

      - name: TypeScript bindings are up to date
        shell: bash
        run: |
          cargo test -p fergit --lib export_bindings
          git diff --exit-code -- ui/src/lib/bindings.ts

  build:
    name: Build (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            args: ""
            rust-targets: ""
            bundle: target/release/bundle
          - name: macos
            os: macos-latest
            # One app for both Apple Silicon and Intel Macs.
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundle: target/universal-apple-darwin/release/bundle
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: build-${{ matrix.name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the app and installers
        run: npm run tauri build -- ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: fergit-${{ matrix.name }}
          path: |
            ${{ matrix.bundle }}/msi/*.msi
            ${{ matrix.bundle }}/nsis/*.exe
            ${{ matrix.bundle }}/dmg/*.dmg
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The installers are named after tauri.conf.json, so a mismatched tag would publish
      # v0.2.0 containing files called 0.1.0.
      - name: Tag matches the app version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(jq -r .version src-tauri/tauri.conf.json)"
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match tauri.conf.json version $version" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: installers/*

  rolling:
    name: Latest build
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      # Deleted rather than updated so that the "latest" tag moves to the new commit.
      - name: Remove the previous latest build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build from main
          body: |
            Unsigned development build of ${{ github.sha }}, replaced on every push to main.
            For a stable version, use a numbered release instead.
          prerelease: true
          draft: false
          files: installers/*
